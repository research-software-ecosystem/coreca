name: Weekly resource scrapping and community filtering

on:
  workflow_dispatch:
  schedule:
    #Every Sunday at 8:00 am
    - cron: "0 8 * * 0" 

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "tools"
  cancel-in-progress: false

jobs:
  fetch-recipes:
    runs-on: ubuntu-latest
    name: Fetch Bioconda recipes
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Extract all conda recipes from Bioconda
        run: | 
          python bin/bioconda_manager.py \
            extract \
            --all content/bioconda/recipes_all.json
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      communities: ${{ steps.prepare.outputs.communities }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Prepare communities JSON
        id: prepare
        run: |
          # List all directories in communities/ and format as a JSON array
          communities=$(ls -d communities/*/ | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo "communities=$communities" >> $GITHUB_OUTPUT
  community-filter:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Filter recipes based on keywords
    strategy:
      matrix:
        community: ${{ fromJson(needs.set-matrix.outputs.communities) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Filter recipes based on keywords
        run: | 
          python bin/bioconda_manager.py \
            filter \
            --all communities/all/bioconda/recipes_all.json \
            --json-filtered communities/${{ matrix.community }}//bioconda/recipes_filtered.json \
            --tsv-filtered communities/${{ matrix.community }}//bioconda/recipes_filtered.tsv \
            --status communities/${{ matrix.community }}//bioconda/recipes_status.tsv \
            --keywords communities/${{ matrix.community }}/metadata/keywords.yml
        env: 
          COMMUNITY: ${{ matrix.community }}
      - name: Curate recipes based on status
        run: | 
          python bin/bioconda_manager.py \
            curate \
            --filtered communities/${{ matrix.community }}/bioconda/recipes_filtered.json \
            --status communities/${{ matrix.community }}/bioconda/recipes_status.tsv \
            --json-curated communities/${{ matrix.community }}/bioconda/recipes_curated.json \
            --tsv-curated communities/${{ matrix.community }}/bioconda/recipes_curated.tsv
        env: 
          COMMUNITY: ${{ matrix.community }}
      - name: Archive workflows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: workflows
          path: communities/${{ matrix.community }}/bioconda/recipes*
        env: 
          COMMUNITY: ${{ matrix.community }}
  fetch-rsec:
    runs-on: ubuntu-latest
    name: Fetch RSEc resources
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: python -m pip install -r requirements.txt
  #    - name: Fetch RSEc
  #      run: | 
  #        bash sources/bin/extract_all_tools.sh
  #    - name: Archive tools
  #      uses: actions/upload-artifact@v5
  #      with:
  #        name: tools-${{ matrix.subset }}
  #        path: communities/all/resources/${{ matrix.subset }}_tools.*
  fetch-tutorials:
    runs-on: ubuntu-latest
    name: Fetch tutorials
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
  #    - name: Fetch all tutorials
  #      run: | 
  #        bash sources/bin/extract_all_tutorials.sh
  #    - name: Archive tutorials artifacts
  #      uses: actions/upload-artifact@v5
  #      with:
  #        name: tutorials
  #        path: communities/all/resources/tutorials.*
  fetch-workflows:
    runs-on: ubuntu-latest
    name: Fetch workflows
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Extract all workflows metadata from WorkflowHub
        run: | 
          python bin/extract_workflowhub.py \
            extract \
            --all communities/all/workflowhub/workflows_full.json
      - name: Filter workflows based on keywords and EDAM terms
        run: | 
          python bin/extract_workflowhub.py \
            filter \
            --all communities/all/workflowhub/workflows_full.json \
            --filtered communities/${{ matrix.community }}/workflowhub/workflows_filtered.json \
            --tsv-filtered communities/${{ matrix.community }}/workflowhub/workflows_filtered.tsv \
            --tags communities/${{ matrix.community }}/metadata/keywords.yml \
            --status communities/${{ matrix.community }}/workflowhub/workflows_status.tsv
      - name: Extract all workflows metadata from WorkflowHu
        run: | 
          python bin/extract_workflowhub.py \
            curate \
            --filtered communities/${{ matrix.community }}/workflowhub/workflows_filtered.json \
            --curated communities/${{ matrix.community }}/workflowhub/workflows_curated.json \
            --tsv-curated communities/${{ matrix.community }}/workflowhub/workflows_curated.tsv \
            --status communities/${{ matrix.community }}/workflowhub/workflows_status.tsv
      - name: Archive workflows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: workflows
          path: communities/${{ matrix.community }}/workflowhub/workflows*
  merge-resources:
    runs-on: ubuntu-latest
    needs: 
      - fetch-rsec
      - fetch-tutorials
      - fetch-recipes
      - fetch-workflows
    name: Merge resources and extract missing tools
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      #- name: Download RSEc resources
      #  uses: actions/download-artifact@v6
      #  with:
      #    pattern: tools-*
      #    merge-multiple: true
      #    path: communities/all/resources/
      #- name: Download tutorials
      #  uses: actions/download-artifact@v6
      #  with:
      #    pattern: tutorials
      #    merge-multiple: true
      #    path: communities/all/resources/
      - name: Download workflows
        uses: actions/download-artifact@v6
        with:
          pattern: workflows
          merge-multiple: true
          path: communities/${{ matrix.community }}/workflowhub/
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Update resources
          title: Automatic resources update
          body: Automatic resource update done via GitHub Action once a week
          base: main
          branch: resource-update
          delete-branch: true
