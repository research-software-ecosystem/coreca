name: Weekly resource filtering and curation for each community

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'scorreard_community_filtering_action'
    paths:
      - 'communities/all/**'

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "tools"
  cancel-in-progress: false

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      communities: ${{ steps.prepare.outputs.communities }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Prepare communities JSON
        id: prepare
        run: |
          # List all directories in communities/ and format as a JSON array
          communities=$(ls -d communities/*/ | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo "communities=$communities" >> $GITHUB_OUTPUT
  filter-and-curate-workflows:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Filter and curate workflows and extract tools for each community
    strategy:
      matrix:
        community: ${{ fromJson(needs.set-matrix.outputs.communities) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Filter community workflows based on keywords and EDAM terms
        run: | 
          python bin/extract_workflowhub.py \
            filter \
            --all communities/all/workflowhub/workflows_full.json \
            --filtered communities/${{ matrix.community }}/workflowhub/workflows_filtered.json \
            --tsv-filtered communities/${{ matrix.community }}/workflowhub/workflows_filtered.tsv \
            --tags communities/${{ matrix.community }}/metadata/keywords.yml \
            --status communities/${{ matrix.community }}/workflowhub/workflows_status.tsv
      - name: Curate community workflows
        run: | 
          python bin/extract_workflowhub.py \
            curate \
            --filtered communities/${{ matrix.community }}/workflowhub/workflows_filtered.json \
            --curated communities/${{ matrix.community }}/workflowhub/workflows_curated.json \
            --tsv-curated communities/${{ matrix.community }}/workflowhub/workflows_curated.tsv \
            --status communities/${{ matrix.community }}/workflowhub/workflows_status.tsv
      - name: Extract tools from community workflows
        run: | 
          python bin/extract_workflowhub.py \
            extract_tools \
            --workflows communities/${{ matrix.community }}/workflowhub/workflows_curated.json \
            --tools communities/${{ matrix.community }}/workflowhub/tools_from_workflows.json
      - name: Archive workflows filtered curated and associated tools
        uses: actions/upload-artifact@v5
        with:
          name: filtered-curated-workflows
          path: communities/${{ matrix.community }}/workflowhub/*
  filter-rsec-tools:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Filter RSEc tools based on keywords and EDAM terms
    strategy:
      matrix:
        community: ${{ fromJson(needs.set-matrix.outputs.communities) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Filter rsec tools
        run: | 
          python bin/extract_rsec.py \
            filter \
            --all communities/all/rsec/ \
            --json communities/${{ matrix.community }}/rsec/validated_tools_metadata.json \
            --tsv communities/${{ matrix.community }}/rsec/validated_tools_summary.tsv \
            --keywords communities/${{ matrix.community }}/metadata/keywords.yml
      - name: Archive filtered rsec tools
        uses: actions/upload-artifact@v5
        with:
          name: filtered-rsec-tools
          path: communities/${{ matrix.community }}/rsec/validated_tools*
  filter-and-curate-bioconda-recipes:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Filter and curate bioconda recipes
    strategy:
      matrix:
        community: ${{ fromJson(needs.set-matrix.outputs.communities) }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Filter Bioconda recipies
        run: | 
          python bin/bioconda_manager.py \
            filter \
            --all communities/all/bioconda/bioconda_full.json \
            --json-filtered communities/${{ matrix.community }}/bioconda/bioconda_filtered.json \
            --tsv-filtered communities/${{ matrix.community }}/bioconda/bioconda_filtered.tsv \
            --keywords communities/${{ matrix.community }}/metadata/keywords.yml \
            --status communities/${{ matrix.community }}/bioconda/bioconda_status.tsv
      - name: Curate Bioconda recipies
        run: | 
          python bin/bioconda_manager.py \
            curate \
            --filtered communities/${{ matrix.community }}/bioconda/bioconda_filtered.json \
            --json-curated communities/${{ matrix.community }}/bioconda/bioconda_curated.json \
            --tsv-curated communities/${{ matrix.community }}/bioconda/bioconda_curated.tsv \
            --status communities/${{ matrix.community } }/bioconda/bioconda_status.tsv
      - name: Archive filtered and curated bioconda recipes
        uses: actions/upload-artifact@v5
        with:
          name: filtered-curated-bioconda-recipes
          path: communities/${{ matrix.community }}/bioconda/*
  merge-resources:
    runs-on: ubuntu-latest
    needs: 
      - filter-and-curate-workflows
      - filter-rsec-tools
      - filter-and-curate-bioconda-recipes
    name: Merge resources
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requirement
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install jq
      - name: Download workflows
        uses: actions/download-artifact@v6
        with:
          # pattern: *
          merge-multiple: true
          path: communities/*/workflowhub/
      - name: Download rsec tools
        uses: actions/download-artifact@v6
        with:
          pattern: rsec
          merge-multiple: true
          path: communities/*/rsec/
      - name: Download bioconda recipes
        uses: actions/download-artifact@v6
        with:
          pattern: bioconda recipes
          merge-multiple: true
          path: communities/*/bioconda/
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: ${{ matrix.community }} community resources update
          title: ${{ matrix.community }} community automatic resources update
          body: ${{ matrix.community }} community automatic resource update done via GitHub Action once a week
          base: main
          branch: ${{ matrix.community }}-resource-update
          delete-branch: true
          add-paths: |
            communities/
